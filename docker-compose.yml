services:
  overtime-tracker:
    image: ghcr.io/elliottmarter/overtime-tracker:latest
    # build: .                     # use this instead of image to build from source
    container_name: overtime-tracker
    ports:
      - "8080:8080"
    environment:
      TZ: Europe/London
      # PUID: 1000                 # user/group the app runs as and owns /data
      # PGID: 1000
      # Optional login for the web UI. Set both, or leave both out to run without a login.
      # APP_USERNAME: change-me
      # APP_PASSWORD: change-me
    volumes:
      - overtime-data:/data
    restart: unless-stopped

volumes:
  overtime-data:
